seed: 42

paths:
  data: data/CMAPSSData
  models: models
  reports: reports

data:
  # Mirror of the NASA Prognostics Center of Excellence turbofan files.
  mirror: https://github.com/edwardzjl/CMAPSSData
  subsets: [FD001, FD002, FD003, FD004]

labels:
  # Targets above this many cycles are clipped (see README, "Design choices").
  rul_cap: 125

split:
  val_fraction: 0.2

features:
  window: 30
  # The 14 sensors that vary in FD001; the same set is used for every subset.
  sensors: [s2, s3, s4, s7, s8, s9, s11, s12, s13, s14, s15, s17, s20, s21]

lstm:
  hidden: 64
  layers: 2
  dropout: 0.2
  lr: 0.001
  batch_size: 256
  max_epochs: 40
  patience: 6
  seeds: [0, 1, 2]

lightgbm:
  n_estimators: 400
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 40
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8

anomaly:
  smooth: 10             # cycles averaged before measuring distance
  baseline_cycles: 20    # each engine's first cycles define its own healthy baseline
  quantile: 0.99         # threshold = this quantile of healthy training distances
  persist: 5             # cycles in a row above threshold before an alarm
  near_failure_rul: [30, 50]

serve:
  # FD004 covers all six operating conditions and both fault modes (see README, transfer table).
  subset: FD004

mlflow:
  # Local SQLite store; view with: mlflow ui --backend-store-uri sqlite:///mlflow.db
  tracking_uri: sqlite:///mlflow.db
  experiment: turbofan-rul
