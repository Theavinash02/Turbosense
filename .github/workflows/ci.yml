name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[train,api,dev]"
      - run: ruff check src tests
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t turbofan-rul .
      - name: Start the API and send the example request
        run: |
          docker run -d --name api -p 8000:8000 turbofan-rul
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d @examples/request.json | tee response.json
          python3 -c "import json; r = json.load(open('response.json')); assert 0 <= r['rul_cycles'] <= 125, r"
      - if: failure()
        run: docker logs api