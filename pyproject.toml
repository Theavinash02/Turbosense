[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbofan-rul"
version = "0.1.0"
description = "Remaining useful life prediction on NASA C-MAPSS turbofan data."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "torch>=2.2",
]

[project.optional-dependencies]
train = ["lightgbm>=4.0", "mlflow>=2.14"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.5"]

[project.scripts]
rul = "rul.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
